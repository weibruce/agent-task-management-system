# Atms-owned patch over the standalone sdk-minimal profile.
# stdout remains reserved for the SDK JSON-RPC transport.

- id: llm-deepseek
  disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: !!js process.env.DSH_SYSTEM_PROMPT

- id: persistent-bash
  disabled: true

- id: persistent-pwsh
  disabled: true

- id: str-replace-editor
  disabled: true

# Raise the one-shot terminal timeouts well above the 300s sdk-minimal
# default. Long build/install commands (npm install, cargo build, docker
# build) routinely exceed 5 minutes; hitting the timeout kills the DSH
# runtime mid-turn (exit code 0) which surfaces in the UI as
# "这次没能完成，我可以继续重试". 30 minutes matches MANAGER_AGENT_TURN_TIMEOUT_MS.
- id: terminal-bash
  config:
    timeoutMs: 1800000

- id: terminal-pwsh
  config:
    timeoutMs: 1800000

- id: sessions
  config:
    root: !!js process.env.DSH_SESSION_ROOT
    compression: none

- id: sdk-jsonrpc-server
  config:
    maxTokensAsSuccess: true

- insert:
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers: !!js JSON.parse(process.env.ATMS_DSH_PROVIDERS_JSON || '{}')

    - id: atms-tools
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: atms
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js process.env.ATMS_DSH_MCP_SCRIPT
        cwd: !!js process.env.DSH_CWD
        env:
          ATMS_MCP_BRIDGE_URL: !!js process.env.ATMS_MCP_BRIDGE_URL
          ATMS_MCP_BRIDGE_TOKEN: !!js process.env.ATMS_MCP_BRIDGE_TOKEN
        failOnStartupError: true
        reconnect:
          enabled: false
