api_version: atms.ai/v1
kind: Workflow
metadata:
  id: phase2a-backend-fanout-v3
  name: Phase 2a Backend Fanout (Path-Pinned)
spec:
  description: Planner-led fan-out for Phase 2a backend work, pinned to an explicit project path with mandatory preflight.
  workspace:
    mode: shared
  contracts:
    Objective:
      type: string
      minLength: 1
    Plan:
      type: object
      required: [context, work_items]
      properties:
        context:
          type: string
          minLength: 1
        work_items:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: object
            required: [id, task, acceptance_criteria]
            properties:
              id:
                type: string
                minLength: 1
              task:
                type: string
                minLength: 1
              acceptance_criteria:
                type: array
                minItems: 1
                items:
                  type: string
                  minLength: 1
    WorkerResult:
      type: object
      required: [status, evidence]
      properties:
        status:
          enum: [success, failed]
        evidence:
          type: object
  agents:
    orchestrator:
      system: >-
        Plan only and do not execute work. Copy the supplied objective verbatim into the top-level context field so every
        worker receives the same immutable source context, including the exact project path
        /workspace. Decompose into at most 8 non-overlapping work_items, one per
        file set listed in the objective. Every item must contain exactly id, task, and acceptance_criteria (a JSON array
        of strings, never a single string). Never precompute findings, evidence, status, or results. Do not add verifier,
        reviewer, or aggregator items. Your first and only tool call must hand off on the exact port planned with only
        top-level context and work_items.
    worker:
      system: >-
        You are a read-only inspection worker. The project directory is /workspace.
        Use only the Read, Grep, Glob, and LS tools to inspect files.
        For each file in your task, read it and report: file path, line count, and a one-line summary.
        Do NOT write or modify any files. Do NOT run shell commands.
        If a file does not exist, note that fact in your evidence and continue with the remaining files.
        Your final tool call must hand off on the exact port result with exactly one JSON object containing
        top-level status (success or failed) and top-level evidence with the report table.
        Use status "success" if you were able to read the files (even if some are missing).
        Use status "failed" only if you could not read any file at all.
        Never use done, completed, or pass.
    verifier:
      system: >-
        You are a read-only verifier. Use Read, Grep, Glob, and LS tools to check files under /workspace.
        Verify that the files mentioned in the worker evidence actually exist and have credible content.
        Do NOT write or modify any files. Do NOT run shell commands.
        Your first and only tool call must hand off on the exact port verified when the evidence is credible,
        otherwise on the exact port failed with a note explaining what is missing.
  nodes:
    plan:
      kind: agent
      agent: orchestrator
      allowed_builtin_tools: []
      allowed_dag_tools: [handoff]
      inputs:
        objective:
          contract: Objective
      outputs:
        planned:
          contract: Plan
    fanout:
      kind: fanout
      inputs:
        plan:
          contract: Plan
      outputs:
        passed: {}
        failed: {}
      config:
        input: plan
        item_field: work_items
        context_field: context
        worker_agent: worker
        max_items: 16
        max_parallelism: 4
        completion: n_of_m
        threshold: 3
        worker_policy:
          allowed_builtin_tools: ["Read", "Grep", "Glob", "LS"]
          workspace_access:
            writable_paths: []
            readonly_paths: ["."]
        result_contract: WorkerResult
        success_field: status
        success_values: [success]
        result_port: passed
        failed_port: failed
        cancel_remaining: false
    verify:
      kind: agent
      agent: verifier
      allowed_builtin_tools: []
      allowed_dag_tools: [handoff]
      inputs:
        aggregate: {}
      outputs:
        verified: {}
        failed: {}
    done:
      kind: terminal
      outcome: success
      inputs:
        result: {}
    worker_failed:
      kind: terminal
      outcome: failure
      inputs:
        result: {}
    verification_failed:
      kind: terminal
      outcome: failure
      inputs:
        result: {}
  edges:
    - from: $run.input
      to: plan.objective
    - from: plan.planned
      to: fanout.plan
    - from: fanout.passed
      to: verify.aggregate
    - from: fanout.failed
      to: worker_failed.result
      condition: on_failure
    - from: verify.verified
      to: done.result
    - from: verify.failed
      to: verification_failed.result
      condition: on_failure
  policies:
    max_nodes: 300
    max_parallelism: 4
    max_dispatches: 1000
    max_corrections_per_node: 3
  pattern:
    id: orchestrator-workers
    version: 1.2.0
